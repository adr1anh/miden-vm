[package]
name = "miden-core"
version = "1.0.0-rc.1"

[lib]
namespace = "miden::core"
path = "mod.masm"
naming = { convention = "defining-paths", binding = { selection = "custom", home = [] } }

[dependencies]

[profile.release]
# Always produce debug information, as it can be stripped later by the VM
debug = true
# Use workspace-relative file paths in debug info for portability
trim_paths = true
